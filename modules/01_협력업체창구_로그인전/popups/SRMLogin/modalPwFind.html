<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비밀번호 찾기</title>
  <link rel="stylesheet" href="../../../assets/styles/style.css">
</head>
<body class="popup-document">
<div class="modal-backdrop" id="modalPwFind" role="dialog" aria-modal="true" aria-labelledby="pwFindModalTitle" aria-hidden="false">
    <div class="modal-dialog modal-lg">
      <div class="modal-header">
        <h2 class="modal-title" id="pwFindModalTitle">비밀번호 찾기</h2>
        <button type="button" class="modal-close" aria-label="닫기">&times;</button>
      </div>
      <div class="modal-body">
        <div class="notice-box" role="note">
          <span class="notice-icon" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg></span>
          <div class="notice-body">
            <p class="notice-lead">비밀번호를 찾기 위해서는 협력업체 신청 시 등록한 담당자의 정보 확인이 필요합니다.</p>
            <p>정보가 확인되면 담당자의 이메일로 '임시 비밀번호'가 발송됩니다. 문의사항은 02-6959-4561로 연락 부탁드립니다.</p>
          </div>
        </div>
        <div class="srm-kv-grid content-inner-gap-top description-marker-container">
          <span class="description-target-marker marker-top-left" aria-hidden="true">1</span>
          <div class="srm-kv-row"><dt>사업자등록번호(아이디) <span class="required" aria-hidden="true">*</span></dt><dd><input type="text" class="form-control" placeholder="숫자로만 입력해 주세요."></dd></div>
          <div class="srm-kv-row"><dt>담당자 이메일 <span class="required" aria-hidden="true">*</span></dt><dd><input type="text" class="form-control w-140 inline-control"> @ <select class="filter-select w-150 inline-control"><option>이메일 선택</option><option>직접 입력</option></select></dd></div>
          <div class="srm-kv-row"><dt>담당자 핸드폰 번호 <span class="required" aria-hidden="true">*</span></dt><dd><input type="text" class="form-control w-60 inline-control" value="010"> - <input type="text" class="form-control w-60 inline-control"> - <input type="text" class="form-control w-60 inline-control"></dd></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-secondary modal-close">닫기</button>
        <span class="description-marker-anchor">
          <span class="description-target-marker" aria-hidden="true">3</span>
          <button type="button" class="btn-primary" id="btnPwFindSubmit" data-close-modal data-open-modal="modalPwFindSent">비밀번호 찾기</button>
        </span>
      </div>
    </div>
  </div>
  <script src="../../../assets/scripts/dashboard.js"></script>
</body>
</html>
