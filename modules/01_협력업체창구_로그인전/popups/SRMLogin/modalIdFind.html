<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>아이디 찾기</title>
  <link rel="stylesheet" href="../../../../assets/styles/style.css">
</head>
<body class="popup-document">
<div class="modal-backdrop" id="modalIdFind" role="dialog" aria-modal="true" aria-labelledby="idFindModalTitle" aria-hidden="false" data-ui-scope="popup">
    <div class="modal-dialog">
      <div class="modal-header">
        <h2 class="modal-title" id="idFindModalTitle">아이디 찾기</h2>
        <button type="button" class="modal-close" aria-label="닫기">&times;</button>
      </div>
      <div class="modal-body">
        <div class="notice-box" role="note">
          <span class="notice-icon" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg></span>
          <div class="notice-body">
            <p class="notice-lead">본 입찰시스템의 아이디는 협력업체의 '사업자등록번호'입니다.</p>
            <p>사업자등록번호의 숫자만 입력해 주세요. 문의사항은 02-6959-4561로 연락 부탁드립니다.</p>
          </div>
        </div>
      </div>
      <div class="modal-footer"><button type="button" class="btn-secondary modal-close">닫기</button></div>
    </div>
  </div>
  <script src="../../../../assets/scripts/dashboard.js"></script>
</body>
</html>
