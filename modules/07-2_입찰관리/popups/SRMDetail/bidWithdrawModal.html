<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>유찰(재공고) 처리하기</title>
  <link rel="stylesheet" href="../../../../assets/styles/style.css">
</head>
<body class="popup-document">
<div class="modal-backdrop" id="bidWithdrawModal" role="dialog" aria-modal="true" aria-labelledby="bidWithdrawTitle" aria-hidden="false" data-ui-defaults="{&quot;method&quot;:&quot;general&quot;,&quot;award&quot;:&quot;restricted&quot;,&quot;price&quot;:&quot;reserve&quot;}" data-ui-scope="popup">
    <div class="modal-dialog">
      <div class="modal-header"><h2 class="modal-title" id="bidWithdrawTitle">유찰(재공고) 처리하기</h2><button type="button" class="modal-close" aria-label="닫기">&times;</button></div>
      <div class="modal-body">
        <div class="notice-box warning" role="alert">
          <span class="notice-icon" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3 2.5 20h19L12 3Z"/><path d="M12 10v4"/><path d="M12 17h.01"/></svg></span>
          <div class="notice-body">
            <p class="notice-lead">유찰(재공고)로 처리하면 본 입찰공고의 내용을 복사해서 입찰계획 단계로 넘어갑니다. 입찰계획에서 입찰참여 기간 등을 수정하여 재공고를 진행할 수 있습니다.</p>
            <p>낙찰자 선정방법이 '제한적 최저가 입찰', '적격심사'(예비가)이면서 유찰 처리 시점이 개찰 후인 경우에는 '예비가 등록/설정'을 반드시 다시 해야 합니다. 유찰 처리 후에는 되돌릴 수 없습니다.</p>
          </div>
        </div>
        <div class="srm-kv-grid content-inner-gap-top">
          <div class="srm-kv-row"><dt>유찰처리 사유(메모) <span class="required" aria-hidden="true">*</span></dt><dd><input type="text" class="form-control grow" placeholder="100자 이내로 입력해주세요." maxlength="100"></dd></div>
        </div>
      </div>
      <div class="modal-footer"><a href="StepWorkflow.html" class="btn-caution">유찰(재공고) 처리하기</a><button type="button" class="btn-secondary modal-close">취소</button></div>
    </div>
  </div>
  <script src="../../../../assets/scripts/dashboard.js"></script>
</body>
</html>
