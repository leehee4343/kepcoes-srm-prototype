<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>메일/메시지 발송 확인</title>
  <link rel="stylesheet" href="../../../../assets/styles/style.css">
</head>
<body class="popup-document">
<div class="modal-backdrop" id="bidMailConfirmModal" role="alertdialog" aria-modal="true" aria-labelledby="bidMailConfirmTitle" aria-hidden="false" data-ui-defaults="{&quot;method&quot;:&quot;general&quot;,&quot;award&quot;:&quot;restricted&quot;,&quot;price&quot;:&quot;reserve&quot;}" data-ui-scope="popup">
    <div class="modal-dialog">
      <div class="modal-header"><h2 class="modal-title" id="bidMailConfirmTitle">메일/메시지 발송 확인</h2><button type="button" class="modal-close" aria-label="닫기">&times;</button></div>
      <div class="modal-body">
        <div class="notice-box warning" role="alert">
          <span class="notice-icon" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3 2.5 20h19L12 3Z"/><path d="M12 10v4"/><path d="M12 17h.01"/></svg></span>
          <div class="notice-body"><p class="notice-lead">메일/메시지를 발송하면 취소할 수 없습니다.</p><p>발송 대상, 발송방법, 발송내용 등을 확인하세요. 그래도 진행하시겠습니까?</p></div>
        </div>
      </div>
      <div class="modal-footer"><button type="button" class="btn-critical-primary modal-close">메일/메시지 발송</button><button type="button" class="btn-secondary modal-close">취소</button></div>
    </div>
  </div>
  <script src="../../../../assets/scripts/dashboard.js"></script>
</body>
</html>
