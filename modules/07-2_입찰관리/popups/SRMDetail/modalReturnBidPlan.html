<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>‘입찰계획’으로 되돌리기</title>
  <link rel="stylesheet" href="../../../../assets/styles/style.css">
</head>
<body class="popup-document">
<div class="modal-backdrop" id="modalReturnBidPlan" role="dialog" aria-modal="true" aria-labelledby="returnModalTitle" aria-hidden="false" data-ui-defaults="{&quot;method&quot;:&quot;general&quot;,&quot;award&quot;:&quot;restricted&quot;,&quot;price&quot;:&quot;reserve&quot;}" data-ui-scope="popup">
    <div class="modal-dialog">
      <div class="modal-header"><h2 class="modal-title" id="returnModalTitle">‘입찰계획’으로 되돌리기</h2><button type="button" class="modal-close" id="btnCloseReturnModal" aria-label="닫기">×</button></div>
      <div class="modal-body">
        <div class="notice-box warning" role="alert">
          <span class="notice-icon" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3 2.5 20h19L12 3Z"/><path d="M12 10v4"/><path d="M12 17h.01"/></svg></span>
          <div class="notice-body">
            <p class="notice-lead">입찰계획을 통해 등록된 내용 중 반드시 수정해야 할 사항이 있는 경우 해당 입찰 건을 입찰계획 상태로 되돌릴 수 있습니다.</p>
            <p>입찰계획으로 되돌리시겠습니까?</p>
          </div>
        </div>
        <label class="srm-return-reason"><span>되돌리기 사유 <span class="required" aria-hidden="true">*</span></span><textarea id="returnReason" rows="3" placeholder="입찰계획 수정이 필요한 사유를 입력해 주세요."></textarea></label>
      </div>
      <div class="modal-footer"><button type="button" class="btn-caution" id="btnConfirmReturn">‘입찰계획’으로 되돌리기 →</button><button type="button" class="btn-secondary" id="btnCancelReturn">취소</button></div>
    </div>
  </div>
  <script src="../../../../assets/scripts/dashboard.js"></script>
</body>
</html>
