<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>수동 메일/메시지 발송</title>
  <link rel="stylesheet" href="../../../../assets/styles/style.css">
</head>
<body class="popup-document">
<div class="modal-backdrop" id="bidMailSendModal" role="dialog" aria-modal="true" aria-labelledby="bidMailSendTitle" aria-hidden="false">
    <div class="modal-dialog modal-lg">
      <div class="modal-header"><h2 class="modal-title" id="bidMailSendTitle">수동 메일/메시지 발송</h2><button type="button" class="modal-close" aria-label="닫기">&times;</button></div>
      <div class="modal-body">
        <p class="modal-field-label">메일/메시지가 발송되면 '기준 정보 관리 &gt; 메일/메시지 발송현황 조회'에서 반드시 확인할 수 있어야 합니다.</p>
        <div class="srm-kv-grid">
          <div class="srm-kv-row"><dt>발송방법 선택</dt><dd><div class="form-choice-group" role="radiogroup"><label class="form-choice"><input type="radio" name="bidMailMethod" checked>이메일 + 메시지</label><label class="form-choice"><input type="radio" name="bidMailMethod">이메일</label><label class="form-choice"><input type="radio" name="bidMailMethod">메시지</label></div></dd></div>
          <div class="srm-kv-row"><dt>제목 <span class="required" aria-hidden="true">*</span></dt><dd><input type="text" class="form-control" placeholder="100자 이내로 입력해주세요." maxlength="100"></dd></div>
          <div class="srm-kv-row"><dt>이메일 내용 <span class="required" aria-hidden="true">*</span></dt><dd><textarea class="form-control" rows="4" placeholder="Text Area"></textarea></dd></div>
          <div class="srm-kv-row"><dt>메시지(SMS) <span class="required" aria-hidden="true">*</span></dt><dd><textarea class="form-control" rows="2" placeholder="Text Area"></textarea></dd></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-secondary" data-close-modal data-open-modal="bidParticipantDetailModal">취소</button>
        <button type="button" class="btn-critical-primary" data-close-modal data-open-modal="bidMailConfirmModal">메일/메시지 발송</button>
      </div>
    </div>
  </div>
  <script src="../../../../assets/scripts/dashboard.js"></script>
</body>
</html>
