<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>전자결재 요청 시 유의사항</title>
  <link rel="stylesheet" href="../../../../assets/styles/style.css">
</head>
<body class="popup-document">
<div class="modal-backdrop modal-top" id="modalApprovalConfirm" role="alertdialog" aria-modal="true" aria-labelledby="confirmModalTitle" aria-hidden="false">
    <div class="modal-dialog modal-sm">
    <div class="modal-header">
      <h2 class="modal-title" id="confirmModalTitle">전자결재 요청 시 유의사항</h2>
      <button type="button" class="modal-close" id="btnCloseConfirmModal" aria-label="닫기">&times;</button>
    </div>
      <div class="modal-body">
        <div class="notice-box warning" role="alert">
          <span class="notice-icon" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3 2.5 20h19L12 3Z"/><path d="M12 10v4"/><path d="M12 17h.01"/></svg></span>
          <div class="notice-body">
            <p class="notice-lead">전자결재 요청을 하면 더 이상 입력하신 예정가격 산출기초조서가 수정되지 않습니다.</p>
            <p>전자결재 요청하시겠습니까?</p>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-critical-primary" id="btnDoConfirmApproval">전자결재 요청 →</button>
        <button type="button" class="btn-filter-reset" id="btnCancelConfirm">취소</button>
      </div>
    </div>
  </div>
  <script src="../../../../assets/scripts/dashboard.js"></script>
</body>
</html>
