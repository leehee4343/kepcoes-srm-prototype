<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>심사/평가항목 추가/수정</title>
  <link rel="stylesheet" href="../../../../assets/styles/style.css">
</head>
<body class="popup-document">
<div class="modal-backdrop" id="bidEvalItemModal" role="dialog" aria-modal="true" aria-labelledby="bidEvalItemTitle" aria-hidden="false">
    <div class="modal-dialog">
      <div class="modal-header"><h2 class="modal-title" id="bidEvalItemTitle">심사/평가항목 추가/수정</h2><button type="button" class="modal-close" aria-label="닫기">&times;</button></div>
      <div class="modal-body">
        <div class="srm-kv-grid">
          <div class="srm-kv-row"><dt>심사/평가 구분 <span class="required" aria-hidden="true">*</span></dt><dd><div class="form-choice-group" role="radiogroup"><label class="form-choice"><input type="radio" name="bidEvalGubun" checked>계량(정량)</label><label class="form-choice"><input type="radio" name="bidEvalGubun">비계량(정성)</label></div></dd></div>
          <div class="srm-kv-row"><dt>심사/평가 항목 <span class="required" aria-hidden="true">*</span></dt><dd><input type="text" class="form-control"></dd></div>
          <div class="srm-kv-row"><dt>배점 <span class="required" aria-hidden="true">*</span></dt><dd><input type="text" class="form-control" placeholder="숫자로만 입력해주세요.(소수점 가능)"></dd></div>
          <div class="srm-kv-row"><dt>자가심사 여부 <span class="required" aria-hidden="true">*</span></dt><dd><div class="form-choice-group" role="radiogroup"><label class="form-choice"><input type="radio" name="bidSelfEval" checked>불필요</label><label class="form-choice"><input type="radio" name="bidSelfEval">필요</label></div></dd></div>
        </div>
      </div>
      <div class="modal-footer"><button type="button" class="btn-action-primary modal-close">심사/평가 항목 추가</button><button type="button" class="btn-action-primary modal-close">수정</button><button type="button" class="btn-filter-reset modal-close">취소</button></div>
    </div>
  </div>
  <script src="../../../../assets/scripts/dashboard.js"></script>
</body>
</html>
