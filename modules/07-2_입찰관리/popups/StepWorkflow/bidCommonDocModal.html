<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공통 입찰 참여 서류 불러오기</title>
  <link rel="stylesheet" href="../../../../assets/styles/style.css">
</head>
<body class="popup-document">
<div class="modal-backdrop" id="bidCommonDocModal" role="dialog" aria-modal="true" aria-labelledby="bidCommonDocTitle" aria-hidden="false">
    <div class="modal-dialog modal-lg">
      <div class="modal-header"><h2 class="modal-title" id="bidCommonDocTitle">공통 입찰 참여 서류 불러오기</h2><button type="button" class="modal-close" aria-label="닫기">&times;</button></div>
      <div class="modal-body">
        <p class="modal-field-label">기준정보 관리 메뉴에서 설정한 '공통 서류 관리'에서 '입찰 참여 서류' 항목만 불러와서 한 번에 완성하고 조정할 수 있습니다.</p>
        <div class="form-lookup">
          <span class="filter-label w-90">서류 명칭</span>
          <input type="text" class="form-control" placeholder="검색어를 입력하세요.">
          <button type="button" class="btn-filter-search">검색</button>
        </div>
        <div class="table-scroll-wrapper content-inner-gap-top">
          <table class="data-table" aria-label="공통 서류 목록">
            <thead><tr><th>서류 명칭</th><th class="w-70">서류(수)</th><th class="w-70">선택</th></tr></thead>
            <tbody><tr><td class="col-left">일반/공통(공사 사업 기준) 사업에 쓰이는 입찰 서류 목록</td><td>5개</td><td><button type="button" class="btn-action-primary modal-close">선택</button></td></tr></tbody>
          </table>
        </div>
      </div>
      <div class="modal-footer"><button type="button" class="btn-filter-reset modal-close">닫기</button></div>
    </div>
  </div>
  <script src="../../../../assets/scripts/dashboard.js"></script>
</body>
</html>
