<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>입찰참여 가능 업체 추가</title>
  <link rel="stylesheet" href="../../../../assets/styles/style.css">
</head>
<body class="popup-document">
<div class="modal-backdrop" id="bidVendorAddModal" role="dialog" aria-modal="true" aria-labelledby="bidVendorAddTitle" aria-hidden="false">
    <div class="modal-dialog modal-lg">
      <div class="modal-header"><h2 class="modal-title" id="bidVendorAddTitle">입찰참여 가능 업체 추가</h2><button type="button" class="modal-close" aria-label="닫기">&times;</button></div>
      <div class="modal-body">
        <p class="modal-field-label">승인된 협력업체만 호출됩니다.</p>
        <div class="filter-row hstack gap-12">
          <span class="filter-label w-80">조회기간(신청일)</span>
          <div class="date-range-wrap hstack gap-6"><input type="date" class="filter-date-input"><span>~</span><input type="date" class="filter-date-input"></div>
        </div>
        <div class="filter-row hstack gap-12">
          <span class="filter-label w-80">신용평가등급</span>
          <select class="filter-select w-150"><option>신용평가등급 선택</option></select>
        </div>
        <div class="form-lookup content-inner-gap-top">
          <select class="filter-select w-130"><option>검색 구분</option></select>
          <input type="text" class="form-control" placeholder="검색어를 입력하세요.">
          <button type="button" class="btn-filter-search">검색</button>
        </div>
        <div class="table-scroll-wrapper content-inner-gap-top">
          <table class="data-table" aria-label="협력업체 목록">
            <thead><tr><th class="w-40">선택</th><th>사업자번호</th><th>업체명</th><th>대표자</th><th>담당자</th><th>핸드폰번호</th><th>이메일</th><th>신용평가등급</th></tr></thead>
            <tbody>
              <tr><td><input type="checkbox"></td><td>123-45-67891</td><td class="col-left">삼전디에스</td><td>홍길동</td><td>한지훈</td><td>010-1234-5678</td><td>leehee43@naver.com</td><td>-</td></tr>
              <tr><td><input type="checkbox"></td><td>123-45-67891</td><td class="col-left">넷퍼시</td><td>홍길동</td><td>김미라</td><td>-</td><td>-</td><td>AAA</td></tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="modal-footer"><button type="button" class="btn-filter-reset modal-close">취소</button><button type="button" class="btn-action-primary modal-close">선택 추가</button></div>
    </div>
  </div>
  <script src="../../../../assets/scripts/dashboard.js"></script>
</body>
</html>
