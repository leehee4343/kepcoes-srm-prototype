<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>예정가격 산출기초조서 등록 및 전자결재 요청</title>
  <link rel="stylesheet" href="../../../../assets/styles/style.css">
</head>
<body class="popup-document">
<div class="modal-backdrop" id="ssBaseCostModal" role="dialog" aria-modal="true" aria-labelledby="ssBaseCostTitle" aria-hidden="false" data-ui-defaults="{&quot;method&quot;:&quot;sole&quot;,&quot;award&quot;:&quot;lowest&quot;,&quot;price&quot;:&quot;estimated&quot;,&quot;documents&quot;:&quot;false&quot;}" data-ui-scope="popup">
    <div class="modal-dialog modal-lg">
      <div class="modal-header"><h2 class="modal-title" id="ssBaseCostTitle">예정가격 산출기초조서 등록 및 전자결재 요청</h2><button type="button" class="modal-close" aria-label="닫기">&times;</button></div>
      <div class="modal-body">
        <div class="srm-detail-actions content-inner-gap-bottom"><button type="button" class="btn-secondary">행 추가 +</button></div>
        <div class="srm-table-wrap">
          <table class="data-table" aria-label="산출기초조서">
            <thead><tr><th>구분</th><th>추정가액(A)</th><th>사정가액(B)</th><th>증감액(C=B-A)</th><th>비고</th><th class="w-60">삭제</th></tr></thead>
            <tbody>
              <tr><td class="text-left">직접 재료비</td><td class="col-num">31,619,400</td><td class="col-num">31,619,400</td><td class="col-num">0원</td><td><input type="text" class="form-control" placeholder="20자 이내로 간략히 작성해주세요." maxlength="20"></td><td><button type="button" class="btn-row-del">삭제</button></td></tr>
              <tr><td class="text-left">직접 노무비</td><td class="col-num">50,137,750</td><td class="col-num">50,137,750</td><td class="col-num">0원</td><td><input type="text" class="form-control" placeholder="20자 이내로 간략히 작성해주세요." maxlength="20"></td><td><button type="button" class="btn-row-del">삭제</button></td></tr>
              <tr><td class="text-left">경비</td><td class="col-num">4,342,850</td><td class="col-num">4,342,850</td><td class="col-num">0원</td><td><input type="text" class="form-control" placeholder="20자 이내로 간략히 작성해주세요." maxlength="20"></td><td><button type="button" class="btn-row-del">삭제</button></td></tr>
              <tr><td class="text-left">합계(공급가액) <span class="required" aria-hidden="true">*</span></td><td class="col-num">86,100,000</td><td class="col-num">86,100,000</td><td class="col-num">0원</td><td></td><td></td></tr>
              <tr><td class="text-left">부가세 <span class="required" aria-hidden="true">*</span></td><td class="col-num">8,610,000</td><td class="col-num">8,610,000</td><td class="col-num">0원</td><td></td><td></td></tr>
              <tr><td class="text-left">총계 <span class="required" aria-hidden="true">*</span></td><td class="col-num">94,710,000</td><td class="col-num">94,710,000</td><td class="col-num">0원</td><td></td><td></td></tr>
            </tbody>
          </table>
        </div>
        <div class="srm-kv-grid content-inner-gap-top">
          <div class="srm-kv-row"><dt>비고</dt><dd><textarea class="form-control" rows="2" placeholder="Text Area"></textarea></dd></div>
          <div class="srm-kv-row"><dt>첨부파일</dt><dd><div class="form-lookup"><input type="text" class="form-control" readonly placeholder="파일을 첨부해주세요."><button type="button" class="btn-secondary">찾아보기</button></div></dd></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-secondary">저장</button>
        <button type="button" class="btn-critical-primary" data-close-modal data-open-modal="ssBaseCostConfirmModal">전자결재 요청</button>
        <button type="button" class="btn-secondary" data-close-modal>취소</button>
      </div>
    </div>
  </div>
  <script src="../../../../assets/scripts/dashboard.js"></script>
</body>
</html>
