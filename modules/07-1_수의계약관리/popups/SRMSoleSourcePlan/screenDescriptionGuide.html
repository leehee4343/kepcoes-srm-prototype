          <div class="description-mapping-list">

              <pre class="description-source-text">수의계약 건만 별도 본 ‘수의계약 관리’ 프로세스로 처리됨

‘발주계획’의 전자결재가 완료(승인)되면, ‘수의계약 계획 현황’의 검색/조회 목록으로 데이터가 복사되어 자동 등록됨(‘작성중’ 상태로 시작됨)</pre>
