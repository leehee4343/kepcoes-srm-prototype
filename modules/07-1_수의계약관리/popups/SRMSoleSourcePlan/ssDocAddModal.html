<!DOCTYPE html>

<body class="popup-document">

          <div class="srm-kv-row"><dt>수의계약 참여 서류 <span class="required" aria-hidden="true">*</span></dt><dd><input type="text" class="form-control grow" placeholder="20자 이내로 간략히 작성해주세요." maxlength="20"></dd></div>

      </div>
      <div class="modal-footer"><button type="button" class="btn-primary" data-close-modal>수의계약 참여 서류 추가</button><button type="button" class="btn-secondary" data-close-modal>취소</button></div>
    </div>
  </div>
