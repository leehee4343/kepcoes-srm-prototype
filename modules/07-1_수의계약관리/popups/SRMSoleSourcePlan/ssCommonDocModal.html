<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공통 수의계약 참여 서류 불러오기</title>
  <link rel="stylesheet" href="../../../../assets/styles/style.css">
</head>
<body class="popup-document">
<div class="modal-backdrop" id="ssCommonDocModal" role="dialog" aria-modal="true" aria-labelledby="ssCommonDocTitle" aria-hidden="false" data-ui-defaults="{&quot;method&quot;:&quot;sole&quot;,&quot;award&quot;:&quot;lowest&quot;,&quot;price&quot;:&quot;estimated&quot;,&quot;documents&quot;:&quot;false&quot;}" data-ui-scope="popup">
    <div class="modal-dialog modal-xl">
      <div class="modal-header"><h2 class="modal-title" id="ssCommonDocTitle">공통 수의계약 참여 서류 불러오기</h2><button type="button" class="modal-close" aria-label="닫기">&times;</button></div>
      <div class="modal-body">
        <section class="filter-card">
          <form data-ui-scope="filter">
          <div class="filter-row hstack gap-12">
            <span class="filter-label w-80">서류 명칭</span>
            <input type="text" class="filter-text-input w-380" placeholder="검색어를 입력하세요." aria-label="검색어">
          </div>
            <div class="filter-action-row">
              <button type="button" class="btn-filter-search">검색</button>
              <button type="button" class="btn-filter-reset">초기화</button>
            </div>
          </form>
        </section>
        <div class="table-card">
          <div class="table-header-action-row">
            <div class="table-total-count grid-page-summary">1 / 6 (총 55개)</div>
            <div class="table-actions">
              <select class="select-per-page" title="페이지당 표시 건수">
                <option value="10" selected>10개씩</option>
                <option value="20">20개씩</option>
                <option value="50">50개씩</option>
              </select>
            </div>
          </div>
          <div class="table-scroll-wrapper data-grid" tabindex="0" aria-label="공통 서류 목록" data-total-items="55" data-total-pages="6">
            <table class="data-table data-grid-table" aria-label="공통 서류 목록">
            <thead><tr><th>서류 명칭</th><th class="w-70">서류(수)</th><th class="w-70">선택</th></tr></thead>
            <tbody>
              <tr><td class="text-left"><a href="#" data-open-modal="ssCommonDocPreview">수의계약(공사) 사업에 쓰이는 입찰 서류 목록</a></td><td>5개</td><td><button type="button" class="btn-task-register" data-close-modal>선택</button></td></tr>
            </tbody>
          </table>
          </div>
        </div>
      </div>
      <div class="modal-footer"><button type="button" class="btn-secondary" data-close-modal>닫기</button></div>
    </div>
  </div>
  <script src="../../../../assets/scripts/dashboard.js"></script>
</body>
</html>
