<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>전자결재 요청 시 유의사항</title>
  <link rel="stylesheet" href="../../../../assets/styles/style.css">
</head>
<body class="popup-document">
<div class="modal-backdrop" id="ssContractEsignConfirmModal" role="alertdialog" aria-modal="true" aria-labelledby="ssContractEsignConfirmTitle" aria-hidden="false">
    <div class="modal-dialog">
      <div class="modal-header"><h2 class="modal-title" id="ssContractEsignConfirmTitle">전자결재 요청 시 유의사항</h2><button type="button" class="modal-close" aria-label="닫기">&times;</button></div>
      <div class="modal-body">
        <div class="notice-box warning" role="alert">
          <span class="notice-icon" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3 2.5 20h19L12 3Z"/><path d="M12 10v4"/><path d="M12 17h.01"/></svg></span>
          <div class="notice-body">
            <p class="notice-lead">계약요청(전자결재) 처리를 위해서는 반드시 '계약 상대자'를 'ERP의 거래처 정보'와 매핑 시켜야 합니다. 전자결재 요청을 하면 더 이상 입력하신 계약 요청내역이 수정되지 않습니다.</p>
            <p>전자결재 요청하시겠습니까?</p>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-critical-primary" data-close-modal data-open-modal="ssDetailView">계약요청(전자결재)</button>
        <button type="button" class="btn-secondary modal-close">취소</button>
      </div>
    </div>
  </div>
  <script src="../../../../assets/scripts/dashboard.js"></script>
</body>
</html>
