<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>입찰 서류 제출 완료</title>
  <link rel="stylesheet" href="../../../../assets/styles/style.css">
</head>
<body class="popup-document">
<div class="modal-backdrop" id="bidDocSubmitDoneModal" role="alertdialog" aria-modal="true" aria-labelledby="bidDocSubmitDoneTitle" aria-hidden="false">
    <div class="modal-dialog">
      <div class="modal-header"><h2 class="modal-title" id="bidDocSubmitDoneTitle">입찰 서류 제출 완료</h2><button type="button" class="modal-close" aria-label="닫기">&times;</button></div>
      <div class="modal-body">
        <div class="notice-box success" role="note">
          <span class="notice-icon" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span>
          <div class="notice-body">
            <p class="notice-lead">입찰 서류 제출이 완료되었습니다.</p>
            <p>만약 '가격 투찰'을 진행하지 않으셨다면, 입찰 마감일 이전에 '가격 투찰'을 반드시 진행하세요. ('가격 투찰'이 누락되면 입찰 참여가 누락됩니다.) '입찰 참여 현황' 메뉴를 통해 진행현황을 확인/관리하실 수 있습니다.</p>
          </div>
        </div>
      </div>
      <div class="modal-footer"><span class="description-marker-anchor"><span class="description-target-marker" aria-hidden="true">1</span><button type="button" class="btn-primary modal-close">'입찰 참여 현황' 바로가기</button></span></div>
    </div>
  </div>
  <script src="../../../../assets/scripts/dashboard.js"></script>
</body>
</html>
