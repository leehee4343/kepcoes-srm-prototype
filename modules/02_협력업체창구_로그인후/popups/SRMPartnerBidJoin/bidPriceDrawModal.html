<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>예비가 추첨하기</title>
  <link rel="stylesheet" href="../../../../assets/styles/style.css">
</head>
<body class="popup-document">
<div class="modal-backdrop" id="bidPriceDrawModal" role="dialog" aria-modal="true" aria-labelledby="bidPriceDrawTitle" aria-hidden="false" data-ui-scope="popup">
    <div class="modal-dialog">
      <div class="modal-header">
        <h2 class="modal-title" id="bidPriceDrawTitle">예비가 추첨하기</h2>
        <button type="button" class="modal-close" aria-label="닫기">&times;</button>
      </div>
      <div class="modal-body">
        <div class="notice-box description-marker-container" role="note">
          <span class="description-target-marker marker-top-left" aria-hidden="true">1</span>
          <span class="notice-icon" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg></span>
          <div class="notice-body">
            <p class="notice-lead">본 입찰공고는 가격 투찰 시 '예비가 추첨'이 필요합니다.</p>
            <p>입찰의 공정성을 부여하기 위해 진행되는 업무입니다. 아래의 15개 예비가 중 하나를 선택해주세요.</p>
          </div>
        </div>
        <div class="srm-table-wrap content-inner-gap-top">
          <table class="data-table" aria-label="예비가 추첨 번호">
            <tbody>
              <tr><td><label class="form-choice"><input type="radio" name="drawNo">1</label></td><td><label class="form-choice"><input type="radio" name="drawNo">2</label></td><td><label class="form-choice"><input type="radio" name="drawNo">3</label></td><td><label class="form-choice"><input type="radio" name="drawNo">4</label></td><td><label class="form-choice"><input type="radio" name="drawNo">5</label></td></tr>
              <tr><td><label class="form-choice"><input type="radio" name="drawNo">6</label></td><td><label class="form-choice"><input type="radio" name="drawNo">7</label></td><td><label class="form-choice"><input type="radio" name="drawNo">8</label></td><td><label class="form-choice"><input type="radio" name="drawNo">9</label></td><td><label class="form-choice"><input type="radio" name="drawNo">10</label></td></tr>
              <tr><td><label class="form-choice"><input type="radio" name="drawNo">11</label></td><td><label class="form-choice"><input type="radio" name="drawNo">12</label></td><td><label class="form-choice"><input type="radio" name="drawNo">13</label></td><td><label class="form-choice"><input type="radio" name="drawNo">14</label></td><td><label class="form-choice"><input type="radio" name="drawNo">15</label></td></tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-primary" data-close-modal data-open-modal="bidPriceSubmitConfirmModal">예비가 추첨하기</button>
        <button type="button" class="btn-secondary modal-close">취소</button>
      </div>
    </div>
  </div>
  <script src="../../../../assets/scripts/dashboard.js"></script>
</body>
</html>
