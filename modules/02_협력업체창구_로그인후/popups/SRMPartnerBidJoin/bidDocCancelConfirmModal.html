<!DOCTYPE html>
<html lang="ko">
<head>

  <link rel="stylesheet" href="../../../../assets/styles/style.css">
</head>
<body class="popup-document">
<div class="modal-backdrop" id="bidDocCancelConfirmModal" role="alertdialog" aria-modal="true" aria-labelledby="bidDocCancelConfirmTitle" aria-hidden="false" data-ui-scope="popup">
    <div class="modal-dialog">
      <div class="modal-header"><h2 class="modal-title" id="bidDocCancelConfirmTitle">입찰 서류 제출 취소 시 유의사항</h2><button type="button" class="modal-close" aria-label="닫기">&times;</button></div>
      <div class="modal-body">
        <div class="notice-box warning" role="alert">
          <span class="notice-icon" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3 2.5 20h19L12 3Z"/><path d="M12 10v4"/><path d="M12 17h.01"/></svg></span>
          <div class="notice-body">
            <p class="notice-lead">입찰 서류 제출을 취소하면 제출된 서류를 수정할 수 있습니다.</p>
            <p>단, '입찰 마감 일시' 내에 '입찰 서류 제출'을 완료해야 합니다. 입찰 서류 제출을 취소하시겠습니까?</p>
          </div>
        </div>
      </div>
      <div class="modal-footer"><span class="description-marker-anchor"><span class="description-target-marker" aria-hidden="true">2’</span><button type="button" class="btn-delete modal-close">입찰 서류 제출 취소</button></span><button type="button" class="btn-secondary modal-close">취소</button></div>
    </div>
  </div>
  <script src="../../../../assets/scripts/dashboard.js"></script>
