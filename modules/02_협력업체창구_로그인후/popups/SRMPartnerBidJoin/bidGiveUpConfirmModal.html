<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>입찰 포기 시 유의사항</title>
  <link rel="stylesheet" href="../../../../assets/styles/style.css">
</head>
<body class="popup-document">
<div class="modal-backdrop" id="bidGiveUpConfirmModal" role="alertdialog" aria-modal="true" aria-labelledby="bidGiveUpConfirmTitle" aria-hidden="false">
    <div class="modal-dialog">
      <div class="modal-header"><h2 class="modal-title" id="bidGiveUpConfirmTitle">입찰 포기 시 유의사항</h2><button type="button" class="modal-close" aria-label="닫기">&times;</button></div>
      <div class="modal-body">
        <div class="notice-box warning" role="alert">
          <span class="notice-icon" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3 2.5 20h19L12 3Z"/><path d="M12 10v4"/><path d="M12 17h.01"/></svg></span>
          <div class="notice-body">
            <p class="notice-lead">입찰을 포기하면 더 이상 본 입찰공고에 입찰 참여를 할 수 없습니다.</p>
            <p>입찰을 포기하시겠습니까? (포기 시 제출상태가 '입찰 포기'로 변경되며, 고객통보 MSG-014가 발송됩니다.)</p>
          </div>
        </div>
      </div>
      <div class="modal-footer"><button type="button" class="btn-secondary modal-close">취소</button><button type="button" class="btn-delete modal-close">입찰 포기</button></div>
    </div>
  </div>
  <script src="../../../../assets/scripts/dashboard.js"></script>
</body>
