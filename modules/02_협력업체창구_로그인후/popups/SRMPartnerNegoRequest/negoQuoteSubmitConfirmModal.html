<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>수의계약을 위한 견적 제출 시 유의사항</title>
  <link rel="stylesheet" href="../../../../assets/styles/style.css">
</head>
<body class="popup-document">
<div class="modal-backdrop" id="negoQuoteSubmitConfirmModal" role="alertdialog" aria-modal="true" aria-labelledby="negoQuoteSubmitConfirmTitle" aria-hidden="false">
    <div class="modal-dialog">
      <div class="modal-header">
        <h2 class="modal-title" id="negoQuoteSubmitConfirmTitle">수의계약을 위한 견적 제출 시 유의사항</h2>
        <button type="button" class="modal-close" aria-label="닫기">&times;</button>
      </div>
      <div class="modal-body">
        <div class="notice-box warning" role="alert">
          <span class="notice-icon" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3 2.5 20h19L12 3Z"/><path d="M12 10v4"/><path d="M12 17h.01"/></svg></span>
          <div class="notice-body">
            <p class="notice-lead">본 견적을 제출하면 더 이상 수정되지 않습니다. 정확하게 가격이 입력되었는지 다시 한번 확인 부탁드립니다.</p>
            <p>수의계약을 위한 견적 제출을 진행하시겠습니까? (제출 시 진행상태가 '수의계약(견적제출 완료)'로 변경됩니다.)</p>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <span class="description-marker-anchor">
          <span class="description-target-marker" aria-hidden="true">2</span>
          <button type="button" class="btn-critical-primary modal-close">견적 제출하기</button>
        </span>
        <button type="button" class="btn-secondary modal-close">취소</button>
      </div>
    </div>
  </div>
  <script src="../../../../assets/scripts/dashboard.js"></script>
</body>
</html>
