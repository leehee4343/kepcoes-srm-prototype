<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>가격 투찰 제한 안내</title>
  <link rel="stylesheet" href="../../../../assets/styles/style.css">
</head>
<body class="popup-document">
<div class="modal-backdrop" id="bidPriceLimitNoticeModal" role="dialog" aria-modal="true" aria-labelledby="bidPriceLimitTitle" aria-hidden="false">
    <div class="modal-dialog">
      <div class="modal-header">
        <h2 class="modal-title" id="bidPriceLimitTitle">가격 투찰 제한 안내</h2>
        <button type="button" class="modal-close" aria-label="닫기">&times;</button>
      </div>
      <div class="modal-body">
        <div class="notice-box warning" role="alert">
          <span class="notice-icon" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3 2.5 20h19L12 3Z"/><path d="M12 10v4"/><path d="M12 17h.01"/></svg></span>
          <div class="notice-body">
            <p class="notice-lead description-marker-container"><span class="description-target-marker marker-top-left" aria-hidden="true">10’</span>가격 투찰을 위해서는 반드시 '입찰 서류'가 먼저 제출되어야 합니다.</p>
            <p class="description-marker-container"><span class="description-target-marker marker-top-left" aria-hidden="true">10’</span>낙찰자 선정방법이 '제한적 최저가', '2단계 경쟁입찰(규격/가격 분리)', '적격심사'의 경우에는 우선 입찰 서류 제출만으로 입찰 참여가 완료되며, 서류를 통한 '규격(기술) 심사' 후 '가격 투찰'이 진행됩니다. (규격(기술) 심사 후 가격 투찰 시점에 별도 통보 드립니다.) 입찰 서류를 제출하신 후 가격을 투찰해주세요.</p>
          </div>
        </div>
      </div>
      <div class="modal-footer"><button type="button" class="btn-secondary modal-close">닫기</button></div>
    </div>
  </div>
  <script src="../../../../assets/scripts/dashboard.js"></script>
</body>
</html>
