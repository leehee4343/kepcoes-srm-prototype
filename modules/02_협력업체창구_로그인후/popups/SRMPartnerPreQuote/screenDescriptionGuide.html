<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>화면설계 Description</title>
  <link rel="stylesheet" href="../../../../assets/styles/style.css">
</head>
<body class="popup-document">
<div class="modal-backdrop description-guide-backdrop" id="screenDescriptionGuide" role="dialog" aria-modal="false" aria-labelledby="screenDescriptionGuideTitle" aria-hidden="false" data-ui-scope="popup">
    <div class="modal-dialog modal-lg description-modal-dialog">
      <div class="modal-header">
        <h2 class="modal-title" id="screenDescriptionGuideTitle">화면설계 Description</h2>
        <button type="button" class="modal-close" aria-label="닫기">&times;</button>
      </div>
      <div class="modal-body description-modal-body">
        <section class="description-source-section" aria-labelledby="descriptionSearchTitle">
          <h3 id="descriptionSearchTitle">검색/조회</h3>
          <div class="description-mapping-list">
            <div class="description-mapping-item">
              <span class="description-mapping-number" aria-hidden="true">1</span>
              <pre class="description-source-text">해당 협력업체에게 요청된 ‘사전 견적’ 내역 제공</pre>
            </div>
            <div class="description-mapping-item">
              <span class="description-mapping-number" aria-hidden="true">2</span>
              <pre class="description-source-text">검색 구분 : 견적요청번호, 견적요청명</pre>
            </div>
            <div class="description-mapping-item">
              <span class="description-mapping-number" aria-hidden="true">3</span>
              <pre class="description-source-text">진행상태 정의

견적 요청중 : 견적 마감일시 이전
견적 마감 : 견적 마감일시 이후
</pre>
            </div>
            <div class="description-mapping-item">
              <span class="description-mapping-number" aria-hidden="true">4</span>
              <pre class="description-source-text">제출상태 정의

미제출 : 제출 안함
제출완료 : 제출 함
견적포기 : 견적 포기</pre>
            </div>
          </div>
        </section>
        <section class="description-source-section" aria-labelledby="descriptionDetailTitle">
          <h3 id="descriptionDetailTitle">상세정보 / 견적처리</h3>
          <div class="description-mapping-list">
            <div class="description-mapping-item">
              <span class="description-mapping-number" aria-hidden="true">1</span>
              <pre class="description-source-text">사전 견적 요청 시 전달할 내용을 입력한 경우에만 노출</pre>
            </div>
          </div>
        </section>
        <section class="description-source-section" aria-labelledby="descriptionSubmitTitle">
          <h3 id="descriptionSubmitTitle">견적 제출</h3>
          <div class="description-mapping-list">
            <div class="description-mapping-item">
              <span class="description-mapping-number" aria-hidden="true">1</span>
              <pre class="description-source-text">본 협력업체에 등록된 담당자 선택
(아래는 자동 완성)</pre>
            </div>
            <div class="description-mapping-item">
              <span class="description-mapping-number" aria-hidden="true">2</span>
              <pre class="description-source-text">고객 통보 : MSG-011</pre>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>
  <script src="../../../../assets/scripts/dashboard.js"></script>
</body>
</html>
