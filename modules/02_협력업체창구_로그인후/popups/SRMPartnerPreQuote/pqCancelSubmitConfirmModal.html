<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>견적 제출 취소(삭제) 시 유의사항</title>
  <link rel="stylesheet" href="../../../../assets/styles/style.css">
</head>
<body class="popup-document">
<div class="modal-backdrop" id="pqCancelSubmitConfirmModal" role="alertdialog" aria-modal="true" aria-labelledby="pqCancelSubmitTitle" aria-hidden="false" data-ui-scope="popup">
    <div class="modal-dialog">
      <div class="modal-header">
        <h2 class="modal-title" id="pqCancelSubmitTitle">견적 제출 취소(삭제) 시 유의사항</h2>
        <button type="button" class="modal-close" aria-label="닫기">&times;</button>
      </div>
      <div class="modal-body">
        <div class="notice-box warning" role="alert">
          <span class="notice-icon" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3 2.5 20h19L12 3Z"/><path d="M12 10v4"/><path d="M12 17h.01"/></svg></span>
          <div class="notice-body">
            <p class="notice-lead">견적 마감일시 이전에는 '견적 제출 취소'를 처리하신 후에도 견적 제출이 가능합니다.</p>
            <p>견적 제출 취소(삭제)하시겠습니까?</p>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-delete modal-close">견적 제출 취소(삭제)</button>
        <button type="button" class="btn-secondary modal-close">취소</button>
      </div>
    </div>
  </div>
  <script src="../../../../assets/scripts/dashboard.js"></script>
</body>
</html>
