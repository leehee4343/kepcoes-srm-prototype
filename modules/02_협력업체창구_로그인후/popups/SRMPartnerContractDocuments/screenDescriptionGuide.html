<div class="modal-backdrop description-guide-backdrop" id="screenDescriptionGuide" role="dialog" aria-modal="false" aria-labelledby="screenDescriptionGuideTitle" aria-hidden="true">

        <section class="description-source-section" aria-labelledby="descriptionSection1">
          <h3 id="descriptionSection1">계약 관련 서류</h3>
          <p class="description-source-meta">화면설계 02 · 슬라이드 59</p>
          <div class="description-mapping-list">
            <div class="description-mapping-item" data-description-ref="02-59:1">
              <span class="description-mapping-number" aria-hidden="true">1</span>
              <pre class="description-source-text">(제출 후 관리자에 의해 확정되기 전) 해당 공고에 설정된 ‘계약이행 보증금률’, ‘선금이행 보증금률’, ‘하자이행 보증금률’을 보여줌</pre>
            </div>
            <div class="description-mapping-item" data-description-ref="02-59:2">
              <span class="description-mapping-number" aria-hidden="true">2</span>
              <pre class="description-source-text">만약 ‘발급 필요 없음’으로 설정된 경우 제출대상이 아니라는 메시지를 제공함</pre>
            </div>
            <div class="description-mapping-item" data-description-ref="02-59:3">
              <span class="description-mapping-number" aria-hidden="true">3</span>
              <pre class="description-source-text">제출 후 관리자에 의해 확정된 경우 이와 같이 표시함</pre>
            </div>
            <div class="description-mapping-item" data-description-ref="02-59:4">
              <span class="description-mapping-number" aria-hidden="true">4</span>
              <pre class="description-source-text">사업이 진행되는 경과에 따라서 단계적으로 해당되는 보증보험 증권을 제출할 수 있음</pre>
            </div>
          </div>
        </section>
