<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>발주계약 요청 삭제 시 유의사항</title>
  <link rel="stylesheet" href="../../../../assets/styles/style.css">
</head>
<body class="popup-document">
<div class="modal-backdrop" id="ocDeleteConfirmModal" role="alertdialog" aria-modal="true" aria-labelledby="ocDeleteConfirmTitle" aria-hidden="false">
    <div class="modal-dialog">
      <div class="modal-header"><h2 class="modal-title" id="ocDeleteConfirmTitle">발주계약 요청 삭제 시 유의사항</h2><button type="button" class="modal-close" aria-label="닫기">&times;</button></div>
      <div class="modal-body">
        <div class="notice-box warning" role="alert">
          <span class="notice-icon" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3 2.5 20h19L12 3Z"/><path d="M12 10v4"/><path d="M12 17h.01"/></svg></span>
          <div class="notice-body">
            <p class="notice-lead">발주계약 요청 내역을 삭제하면, 매핑된(기 등록된) 세부정보가 모두 삭제됩니다.</p>
            <p>반드시 최고관리자(시스템운영자)만 사용하세요. 그래도 진행하시겠습니까?</p>
          </div>
        </div>
      </div>
      <div class="modal-footer"><button type="button" class="btn-delete modal-close">삭제하기</button><button type="button" class="btn-secondary modal-close">취소</button></div>
    </div>
  </div>
  <script src="../../../../assets/scripts/dashboard.js"></script>
</body>
</html>
