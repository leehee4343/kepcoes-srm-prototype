<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>화면설계 Description</title>
  <link rel="stylesheet" href="../../../../assets/styles/style.css">
</head>
<body class="popup-document">
<div class="modal-backdrop description-guide-backdrop" id="screenDescriptionModal" role="dialog" aria-modal="false" aria-labelledby="screenDescriptionModalTitle" aria-hidden="false">
    <div class="modal-dialog modal-lg description-modal-dialog">
      <div class="modal-header">
        <h2 class="modal-title" id="screenDescriptionModalTitle">화면설계 Description</h2>
        <button type="button" class="modal-close" aria-label="닫기">×</button>
      </div>
      <div class="modal-body description-modal-body">
        <section class="description-source-section" aria-labelledby="descriptionSearchTitle">
          <h3 id="descriptionSearchTitle">검색/조회</h3>
          <div class="description-mapping-list">
            <div class="description-mapping-item">
              <span class="description-mapping-number" aria-hidden="true">1</span>
              <pre class="description-source-text">검색 구분 : 전체, 사원번호, 아이디, 사원명, 부서, 직급, 이메일</pre>
            </div>
            <div class="description-mapping-item">
              <span class="description-mapping-number" aria-hidden="true">2</span>
              <pre class="description-source-text">공통 적용 : 10개씩, 20개씩,30개씩, 50개씩, 100개씩</pre>
            </div>
            <div class="description-mapping-item">
              <span class="description-mapping-number" aria-hidden="true">3</span>
              <pre class="description-source-text">공통 적용 : 목록의 내용 그대로 엑셀 다운로드 기능 제공단, 특정 목록에서 상세정보의 일부가 엑셀 데이터에 수록되어야 하는 경우 별도로 항목을 정의하여 Description 영역에서 설명함</pre>
            </div>
          </div>
        </section>
        <section class="description-source-section" aria-labelledby="descriptionDetailTitle">
          <h3 id="descriptionDetailTitle">상세정보</h3>
          <div class="description-mapping-list">
            <div class="description-mapping-item">
              <span class="description-mapping-number" aria-hidden="true">1</span>
              <pre class="description-source-text">사용 여부에 따라 본 시스템에 접속 제한.&#32;</pre>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>
  <script src="../../../../assets/scripts/dashboard.js"></script>
</body>
</html>
