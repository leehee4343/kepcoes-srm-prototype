<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>화면설계 Description</title>
  <link rel="stylesheet" href="../../../../assets/styles/style.css">
</head>
<body class="popup-document">
<div class="modal-backdrop description-guide-backdrop" id="codeDescriptionGuide" role="dialog" aria-modal="false" aria-labelledby="codeDescriptionGuideTitle" aria-hidden="false" data-ui-scope="popup">
    <div class="modal-dialog description-modal-dialog">
      <div class="modal-header">
        <h2 class="modal-title" id="codeDescriptionGuideTitle">화면설계 Description</h2>
        <button type="button" class="modal-close" aria-label="닫기">×</button>
      </div>
      <div class="modal-body description-modal-body">
        <section class="description-source-section" aria-labelledby="codeDescriptionGuideSection1">
          <h3 id="codeDescriptionGuideSection1">검색/조회</h3>
          <div class="description-mapping-list">
            <div class="description-mapping-item">
              <span class="description-mapping-number" aria-hidden="true">1</span>
              <pre class="description-source-text">검색 구분 : 코드, 대분류 코드명, 설명</pre>
            </div>
            <div class="description-mapping-item">
              <span class="description-mapping-number" aria-hidden="true">2</span>
              <pre class="description-source-text">개발 당시에만 사용 : 컨펌 박스 노출코드 삭제 시 시스템에 영향(값 삭제, 정보 유실 등)이 있을 수 있습니다. 시스템 관리자의 점검 후 삭제하세요. 본 코드를 삭제하시겠습니까?</pre>
            </div>
            <div class="description-mapping-item">
              <span class="description-mapping-number" aria-hidden="true">3</span>
              <pre class="description-source-text">다음 페이지의 ‘코드 관리’ 팝업 호출</pre>
            </div>
            <div class="description-mapping-item">
              <span class="description-mapping-number" aria-hidden="true">4</span>
              <pre class="description-source-text">만약, 본 시스템에서 코드가 4Depth로 구성되어야 하는 항목이 있다면 [세분류 코드(4Depth)]를 추가해서 개발할 것</pre>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>
  <script src="../../../../assets/scripts/dashboard.js"></script>
</body>
</html>
