<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>화면설계 Description</title>
  <link rel="stylesheet" href="../../../../assets/styles/style.css">
</head>
<body class="popup-document">
<div class="modal-backdrop description-guide-backdrop" id="noticeDescriptionGuide" role="dialog" aria-modal="false" aria-labelledby="noticeDescriptionGuideTitle" aria-hidden="false" data-ui-scope="popup">
    <div class="modal-dialog description-modal-dialog">
      <div class="modal-header">
        <h2 class="modal-title" id="noticeDescriptionGuideTitle">화면설계 Description</h2>
        <button type="button" class="modal-close" aria-label="닫기">×</button>
      </div>
      <div class="modal-body description-modal-body">
        <section class="description-source-section" aria-labelledby="noticeDescriptionGuideSection1">
          <h3 id="noticeDescriptionGuideSection1">검색/조회</h3>
          <div class="description-mapping-list">
            <div class="description-mapping-item">
              <span class="description-mapping-number" aria-hidden="true">1</span>
              <pre class="description-source-text">검색 구분 : 전체, 제목, 제목+내용</pre>
            </div>
            <div class="description-mapping-item">
              <span class="description-mapping-number" aria-hidden="true">2</span>
              <pre class="description-source-text">게시대상(SRM에서만 사용)- 전체 게시 - 내부 직원 대상 게시- 외부 협력업체 대상 게시(협력업체에게도 해당 공지 내용이 보임)</pre>
            </div>
            <div class="description-mapping-item">
              <span class="description-mapping-number" aria-hidden="true">3</span>
              <pre class="description-source-text">우선노출이 ‘Y’로설정된 게시물이 가장 위에 올라옴</pre>
            </div>
            <div class="description-mapping-item">
              <span class="description-mapping-number" aria-hidden="true">4</span>
              <pre class="description-source-text">게시기간 : 무관(계속 게시됨)</pre>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>
  <script src="../../../../assets/scripts/dashboard.js"></script>
</body>
</html>
