<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시스템 권한 삭제</title>
  <link rel="stylesheet" href="../../../../assets/styles/style.css">
</head>
<body class="popup-document">
<div class="modal-backdrop" id="sysPermDeleteModal" role="alertdialog" aria-modal="true" aria-labelledby="sysPermDeleteModalTitle" aria-hidden="false" data-ui-scope="popup">
    <div class="modal-dialog">
      <div class="modal-header">
        <h2 class="modal-title" id="sysPermDeleteModalTitle">시스템 권한 삭제</h2>
        <button type="button" class="modal-close" aria-label="닫기">×</button>
      </div>
      <div class="modal-body">
        <div class="notice-box warning" role="alert">
          <span class="notice-icon" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3 2.5 20h19L12 3Z"/><path d="M12 10v4"/><path d="M12 17h.01"/></svg></span>
          <div class="notice-body">
            <p class="notice-lead">현재 부여된 해당 관리자(직원)의 시스템 권한이 상실됩니다.</p>
            <p>진행하시겠습니까?</p>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-delete modal-close">삭제하기</button>
        <button type="button" class="btn-secondary modal-close">취소</button>
      </div>
    </div>
  </div>
  <script src="../../../../assets/scripts/dashboard.js"></script>
</body>
</html>
