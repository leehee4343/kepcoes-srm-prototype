<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>화면설계 Description</title>
  <link rel="stylesheet" href="../../../../assets/styles/style.css">
</head>
<body class="popup-document">
<div class="modal-backdrop description-guide-backdrop" id="permGroupDetailDescriptionGuide" role="dialog" aria-modal="false" aria-labelledby="permGroupDetailDescriptionGuideTitle" aria-hidden="false">
    <div class="modal-dialog description-modal-dialog">
      <div class="modal-header">
        <h2 class="modal-title" id="permGroupDetailDescriptionGuideTitle">화면설계 Description</h2>
        <button type="button" class="modal-close" aria-label="닫기">×</button>
      </div>
      <div class="modal-body description-modal-body">
        <section class="description-source-section" aria-labelledby="permGroupDetailDescriptionGuideSection1">
          <h3 id="permGroupDetailDescriptionGuideSection1">권한그룹 추가하기</h3>
          <div class="description-mapping-list">
            <div class="description-mapping-item">
              <span class="description-mapping-number" aria-hidden="true">1</span>
              <pre class="description-source-text">삭제 시 컨펌(Confirm) 박스“본 매핑 목록에서 삭제하면, 해당 권한을 잃게 됩니다. 본 권한그룹에서 해당 관리자(직원)를 삭제하시겠습니까?”</pre>
            </div>
          </div>
        </section>
        <section class="description-source-section" aria-labelledby="permGroupDetailDescriptionGuideSection2">
          <h3 id="permGroupDetailDescriptionGuideSection2">관리자(직원) 추가하기</h3>
          <div class="description-mapping-list">
            <div class="description-mapping-item">
              <span class="description-mapping-number" aria-hidden="true">1</span>
              <pre class="description-source-text">검색 구분 : 전체, 사원번호, 아이디, 사원명, 부서, 직급, 이메일단, ‘사용 여부’가 ‘사용(Y)’인 관리자만 호출 가능</pre>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>
  <script src="../../../../assets/scripts/dashboard.js"></script>
</body>
</html>
