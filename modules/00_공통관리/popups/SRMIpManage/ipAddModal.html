<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>접속 아이피(IP) 추가하기</title>
  <link rel="stylesheet" href="../../../../assets/styles/style.css">
</head>
<body class="popup-document">
<div class="modal-backdrop" id="ipAddModal" role="dialog" aria-modal="true" aria-labelledby="ipAddModalTitle" aria-hidden="false">
    <div class="modal-dialog">
      <div class="modal-header">
        <h2 class="modal-title" id="ipAddModalTitle">접속 아이피(IP) 추가하기</h2>
        <button type="button" class="modal-close" aria-label="닫기">×</button>
      </div>
      <div class="modal-body">
        <div class="srm-kv-grid">
          <div class="srm-kv-row"><dt>아이피(IP) <span class="required" aria-hidden="true">*</span></dt><dd><input type="text" class="form-control" placeholder="예) 211.215.111.2"></dd></div>
          <div class="srm-kv-row"><dt>아이피(IP) 추가 사유 <span class="required" aria-hidden="true">*</span></dt><dd><input type="text" class="form-control" placeholder="100자 이내로 간략히 작성해 주세요." maxlength="100"></dd></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-secondary modal-close">취소</button>
        <button type="button" class="btn-primary modal-close">접속 아이피(IP) 추가하기</button>
      </div>
    </div>
  </div>
  <script src="../../../../assets/scripts/dashboard.js"></script>
</body>
</html>
