<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>품목 추가(공통 품목)</title>
  <link rel="stylesheet" href="../../../../assets/styles/style.css">
</head>
<body class="popup-document">
<div class="modal-backdrop" id="pqCommonItemModal" role="dialog" aria-modal="true" aria-labelledby="pqCommonItemTitle" aria-hidden="false">
    <div class="modal-dialog modal-lg">
      <div class="modal-header"><h2 class="modal-title" id="pqCommonItemTitle">품목 추가(공통 품목)</h2><button type="button" class="modal-close" aria-label="닫기">&times;</button></div>
      <div class="modal-body">
        <p class="modal-field-label">'기준 정보 관리 &gt; 공통 품목관리'에 등록된 공통 품목 호출</p>
        <div class="filter-row hstack gap-12">
          <span class="filter-label w-80">분류</span>
          <select class="filter-select w-140"><option>전체(대분류)</option></select>
          <select class="filter-select w-140"><option>전체(중분류)</option></select>
          <select class="filter-select w-140"><option>전체(소분류)</option></select>
        </div>
        <div class="filter-row hstack gap-12">
          <span class="filter-label w-80">발주단위</span>
          <select class="filter-select w-140"><option>전체(발주단위)</option></select>
        </div>
        <div class="form-lookup content-inner-gap-top">
          <select class="filter-select w-130"><option>검색 구분</option></select>
          <input type="text" class="form-control" placeholder="검색어를 입력하세요.">
          <button type="button" class="btn-filter-search">검색</button>
        </div>
        <div class="table-scroll-wrapper content-inner-gap-top">
          <table class="data-table" aria-label="공통 품목 목록">
            <thead><tr><th class="w-40">선택</th><th>품목코드</th><th>품목명</th><th>대분류</th><th>중분류</th><th>소분류</th><th>발주단위</th></tr></thead>
            <tbody>
              <tr><td><input type="checkbox"></td><td>A0102-0001</td><td class="text-left">건축공사</td><td>제조사</td><td>고효율</td><td>ESSPCS</td><td>EA</td></tr>
              <tr><td><input type="checkbox"></td><td>A0103-001</td><td class="text-left">고효율 공기 압축기</td><td>-</td><td>-</td><td>-</td><td>EA</td></tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="modal-footer"><button type="button" class="btn-secondary" data-close-modal data-open-modal="pqManageModal">취소</button><button type="button" class="btn-primary" data-close-modal data-open-modal="pqManageModal">선택 추가</button></div>
    </div>
  </div>
  <script src="../../../../assets/scripts/dashboard.js"></script>
</body>
</html>
