<!DOCTYPE html>
<html lang="ko">
<head>

  <link rel="stylesheet" href="../../../../assets/styles/style.css">

<body class="popup-document">
<div class="modal-backdrop" id="pqFinalConfirmModal" role="alertdialog" aria-modal="true" aria-labelledby="pqFinalConfirmTitle" aria-hidden="false" data-ui-defaults="{&quot;items&quot;:&quot;unit&quot;}" data-ui-scope="popup">
    <div class="modal-dialog">
      <div class="modal-header"><h2 class="modal-title" id="pqFinalConfirmTitle">최종 견적 요청 유의사항</h2><button type="button" class="modal-close" aria-label="닫기">&times;</button></div>

          <span class="notice-icon" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3 2.5 20h19L12 3Z"/><path d="M12 10v4"/><path d="M12 17h.01"/></svg></span>
          <div class="notice-body">
            <p class="notice-lead">최종 견적 요청을 하면 업체에게 메일이 발송되며, 견적 요청 내용을 수정할 수 없습니다.</p>
            <p>견적 요청 내용을 모두 확인하셨습니까?</p>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-critical-primary" data-close-modal data-href="SRMPreQuoteRequestComplete.html">최종 견적 요청하기 (업체에게 메일 발송)</button>
        <button type="button" class="btn-secondary modal-close">취소</button>

    </div>
  </div>
  <script src="../../../../assets/scripts/dashboard.js"></script>
