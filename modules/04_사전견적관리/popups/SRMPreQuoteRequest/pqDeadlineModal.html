<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>견적 마감일시 등록</title>
  <link rel="stylesheet" href="../../../../assets/styles/style.css">
</head>
<body class="popup-document">
<div class="modal-backdrop" id="pqDeadlineModal" role="dialog" aria-modal="true" aria-labelledby="pqDeadlineTitle" aria-hidden="false">
    <div class="modal-dialog">
      <div class="modal-header"><h2 class="modal-title" id="pqDeadlineTitle">견적 마감일시 등록</h2><button type="button" class="modal-close" aria-label="닫기">&times;</button></div>
      <div class="modal-body">
        <dl class="srm-kv-grid">
          <div class="srm-kv-row"><dt>견적마감일 <span class="required" aria-hidden="true">*</span></dt><dd><input type="date" class="filter-date-input" aria-label="견적마감일"></dd></div>
          <div class="srm-kv-row"><dt>마감시간 <span class="required" aria-hidden="true">*</span></dt><dd><div class="hstack gap-10"><select class="filter-select w-100" aria-label="마감 시"><option>18시</option></select><select class="filter-select w-100" aria-label="마감 분"><option>00분</option></select></div></dd></div>
        </dl>
      </div>
      <div class="modal-footer"><button type="button" class="btn-primary" data-close-modal>등록</button><button type="button" class="btn-secondary" data-close-modal>취소</button></div>
    </div>
  </div>
  <script src="../../../../assets/scripts/dashboard.js"></script>
</body>
</html>
