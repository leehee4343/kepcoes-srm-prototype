<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>거절 처리 시 유의사항</title>
  <link rel="stylesheet" href="../../../../assets/styles/style.css">
</head>
<body class="popup-document">
<div class="modal-backdrop" id="apRejectConfirmModal" role="alertdialog" aria-modal="true" aria-labelledby="apRejectConfirmTitle" aria-hidden="false">
    <div class="modal-dialog">
      <div class="modal-header"><h2 class="modal-title" id="apRejectConfirmTitle">거절 처리 시 유의사항</h2><button type="button" class="modal-close" aria-label="닫기">&times;</button></div>
      <div class="modal-body">
        <div class="notice-box warning" role="alert">
          <span class="notice-icon" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3 2.5 20h19L12 3Z"/><path d="M12 10v4"/><path d="M12 17h.01"/></svg></span>
          <div class="notice-body">
            <p class="notice-lead">협력업체 신규 신청 건에 대한 거절 처리 시 협력업체의 신청 정보가 모두 삭제됩니다. 삭제 후 해당 업체는 다시 협력업체 신청을 할 수 있습니다. 승인 후 정보 수정을 요구하여 처리하실 수도 있습니다.</p>
            <p>협력업체의 정보 수정 요청 건에 대한 거절 처리 시 수정 전의 정보로 복원됩니다. 거절 후 해당 업체는 다시 정보 변경을 요청할 수 있습니다.</p>
          </div>
        </div>
      </div>
      <div class="modal-footer"><button type="button" class="btn-delete" data-close-modal data-open-modal="apListRedirectHint">거절 처리</button><button type="button" class="btn-secondary modal-close">닫기</button></div>
    </div>
  </div>
  <script src="../../../../assets/scripts/dashboard.js"></script>
</body>
</html>
