<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>서류 추가</title>
  <link rel="stylesheet" href="../../../../assets/styles/style.css">
</head>
<body class="popup-document">
<div class="modal-backdrop" id="cdDocAddModal" role="dialog" aria-modal="true" aria-labelledby="cdDocAddTitle" aria-hidden="false">
    <div class="modal-dialog">
      <div class="modal-header"><h2 class="modal-title" id="cdDocAddTitle">서류 추가</h2><button type="button" class="modal-close" aria-label="닫기">&times;</button></div>
      <div class="modal-body">
        <div class="srm-kv-grid">
          <div class="srm-kv-row"><dt>서류 명칭 <span class="required" aria-hidden="true">*</span></dt><dd><input type="text" class="form-control" placeholder="20자 이내로 간략히 작성해 주세요." maxlength="20"></dd></div>
          <div class="srm-kv-row"><dt>설명</dt><dd><input type="text" class="form-control" placeholder="50자 이내로 간략히 작성해 주세요." maxlength="50"></dd></div>
        </div>
      </div>
      <div class="modal-footer"><button type="button" class="btn-primary" data-close-modal data-open-modal="cdDetailModal">서류 추가</button><button type="button" class="btn-secondary" data-close-modal data-open-modal="cdDetailModal">취소</button></div>
    </div>
  </div>
  <script src="../../../../assets/scripts/dashboard.js"></script>
</body>
</html>
