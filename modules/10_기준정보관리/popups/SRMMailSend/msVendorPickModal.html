<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>협력업체 선택</title>
  <link rel="stylesheet" href="../../../../assets/styles/style.css">
</head>
<body class="popup-document">
<div class="modal-backdrop" id="msVendorPickModal" role="dialog" aria-modal="true" aria-labelledby="msVendorPickTitle" aria-hidden="false">
    <div class="modal-dialog modal-lg">
      <div class="modal-header"><h2 class="modal-title" id="msVendorPickTitle">협력업체 선택</h2><button type="button" class="modal-close" aria-label="닫기">&times;</button></div>
      <div class="modal-body">
        <p class="modal-field-label">승인된 협력업체만 호출됩니다.</p>
        <div class="filter-row hstack gap-12">
          <span class="filter-label w-80">조회기간(신청일)</span>
          <div class="date-range-wrap hstack gap-6"><input type="date" class="filter-date-input"><span>~</span><input type="date" class="filter-date-input"></div>
            <div class="quick-date-btns hstack gap-6">
              <button type="button" class="btn-quick-date" data-range="1d">하루 전</button>
              <button type="button" class="btn-quick-date" data-range="1w">1주일</button>
              <button type="button" class="btn-quick-date active" data-range="1m">1개월</button>
              <button type="button" class="btn-quick-date" data-range="3m">3개월</button>
              <button type="button" class="btn-quick-date" data-range="6m">6개월</button>
              <button type="button" class="btn-quick-date" data-range="1y">1년</button>
            </div>
        </div>
        <div class="filter-row hstack gap-12">
          <span class="filter-label w-80">신용평가등급</span>
          <select class="filter-select w-150"><option>신용평가등급 선택</option></select>
        </div>
        <div class="filter-row hstack gap-12">
          <span class="filter-label w-80">소싱 그룹</span>
          <select class="filter-select w-140"><option>대분류 선택</option></select>
          <select class="filter-select w-140"><option>중분류 선택</option></select>
          <select class="filter-select w-140"><option>소분류 선택</option></select>
        </div>
        <div class="form-lookup content-inner-gap-top">
          <select class="filter-select w-130"><option>검색 구분</option></select>
          <input type="text" class="form-control" placeholder="검색어를 입력하세요.">
          <button type="button" class="btn-filter-search">검색</button>
        </div>
        <div class="table-scroll-wrapper content-inner-gap-top">
          <table class="data-table" aria-label="협력업체 목록">
            <thead><tr><th class="w-40">선택</th><th>처리상태</th><th>사업자 번호</th><th>업체명</th><th>담당자</th><th>휴대전화 번호</th><th>이메일</th><th>신청일</th></tr></thead>
            <tbody>
              <tr><td><input type="checkbox"></td><td><span class="badge-success">승인</span></td><td>123-45-67891</td><td class="text-left">삼전디에스</td><td>한지훈</td><td>010-1234-5678</td><td>leehee43@naver.com</td><td>2026.06.10</td></tr>
              <tr><td><input type="checkbox"></td><td><span class="badge-success">승인</span></td><td>123-45-67891</td><td class="text-left">넷퍼시</td><td>김미라</td><td>-</td><td>-</td><td>2026.06.10</td></tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="modal-footer"><button type="button" class="btn-secondary modal-close">취소</button><button type="button" class="btn-primary modal-close">선택 추가</button></div>
    </div>
  </div>
  <script src="../../../../assets/scripts/dashboard.js"></script>
</body>
</html>
