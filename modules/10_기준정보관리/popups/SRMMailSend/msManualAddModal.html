<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>수동 등록</title>
  <link rel="stylesheet" href="../../../../assets/styles/style.css">
</head>
<body class="popup-document">
<div class="modal-backdrop" id="msManualAddModal" role="dialog" aria-modal="true" aria-labelledby="msManualAddTitle" aria-hidden="false" data-ui-scope="popup">
    <div class="modal-dialog">
      <div class="modal-header"><h2 class="modal-title" id="msManualAddTitle">수동 등록</h2><button type="button" class="modal-close" aria-label="닫기">&times;</button></div>
      <div class="modal-body">
        <div class="srm-kv-grid">
          <div class="srm-kv-row"><dt>이름 <span class="required" aria-hidden="true">*</span></dt><dd><input type="text" class="form-control fit-360" placeholder="예) 홍길동"></dd></div>
          <div class="srm-kv-row"><dt>연락처 <span class="required" aria-hidden="true">*</span></dt><dd><select class="filter-select w-90"><option>010</option></select> - <input type="text" class="form-control w-80"> - <input type="text" class="form-control w-80"></dd></div>
          <div class="srm-kv-row"><dt>이메일 <span class="required" aria-hidden="true">*</span></dt><dd><input type="text" class="form-control w-160"> @ <select class="filter-select w-140"><option value="">이메일 선택</option><option value="direct">직접 입력</option><option value="naver.com">naver.com</option><option value="google.com">google.com</option><option value="hanmail.net">hanmail.net</option><option value="daum.net">daum.net</option><option value="nate.com">nate.com</option></select><input type="text" class="form-control w-160" aria-label="이메일 도메인" placeholder="도메인 직접 입력"></dd></div>
        </div>
      </div>
      <div class="modal-footer"><button type="button" class="btn-primary modal-close">추가</button><button type="button" class="btn-secondary modal-close">취소</button></div>
    </div>
  </div>
  <script src="../../../../assets/scripts/dashboard.js"></script>
</body>
</html>
