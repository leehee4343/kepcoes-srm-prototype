<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>거래처 선택</title>
  <link rel="stylesheet" href="../../../../assets/styles/style.css">
</head>
<body class="popup-document">
<div class="modal-backdrop" id="msClientPickModal" role="dialog" aria-modal="true" aria-labelledby="msClientPickTitle" aria-hidden="false">
    <div class="modal-dialog modal-lg">
      <div class="modal-header"><h2 class="modal-title" id="msClientPickTitle">거래처 선택</h2><button type="button" class="modal-close" aria-label="닫기">&times;</button></div>
      <div class="modal-body">
        <p class="modal-field-label">ERP와 연동된 거래처 목록을 호출합니다.</p>
        <div class="filter-row hstack gap-12">
          <span class="filter-label w-80">조회기간(등록일)</span>
          <div class="date-range-wrap hstack gap-6"><input type="date" class="filter-date-input"><span>~</span><input type="date" class="filter-date-input"></div>
            <div class="quick-date-btns hstack gap-6">
              <button type="button" class="btn-quick-date" data-range="1d">하루 전</button>
              <button type="button" class="btn-quick-date" data-range="1w">1주일</button>
              <button type="button" class="btn-quick-date active" data-range="1m">1개월</button>
              <button type="button" class="btn-quick-date" data-range="3m">3개월</button>
              <button type="button" class="btn-quick-date" data-range="6m">6개월</button>
              <button type="button" class="btn-quick-date" data-range="1y">1년</button>
            </div>
        </div>
        <div class="filter-row hstack gap-12">
          <span class="filter-label w-80">휴/폐업 구분</span>
          <div class="form-choice-group" role="radiogroup">
            <label class="form-choice"><input type="radio" name="msClientState" checked>전체</label>
            <label class="form-choice"><input type="radio" name="msClientState">정상</label>
            <label class="form-choice"><input type="radio" name="msClientState">중지</label>
          </div>
        </div>
        <div class="form-lookup content-inner-gap-top">
          <select class="filter-select w-130"><option>검색 구분</option></select>
          <input type="text" class="form-control" placeholder="검색어를 입력하세요.">
          <button type="button" class="btn-filter-search">검색</button>
        </div>
        <div class="table-scroll-wrapper content-inner-gap-top">
          <table class="data-table" aria-label="거래처 목록">
            <thead><tr><th class="w-40">선택</th><th>거래처 코드</th><th>거래처명</th><th>사업자등록번호</th><th>거래 담당자</th><th>휴/폐업 구분</th><th>등록일</th></tr></thead>
            <tbody>
              <tr><td><input type="checkbox"></td><td>02663</td><td class="text-left">큐비트엑스</td><td>349-83-01795</td><td class="text-left">이희성 (leehee43@naver.com, 010-6844-2810)</td><td><span class="badge-success">정상</span></td><td>2026.06.09</td></tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="modal-footer"><button type="button" class="btn-secondary modal-close">취소</button><button type="button" class="btn-primary modal-close">선택 추가</button></div>
    </div>
  </div>
  <script src="../../../../assets/scripts/dashboard.js"></script>
</body>
</html>
