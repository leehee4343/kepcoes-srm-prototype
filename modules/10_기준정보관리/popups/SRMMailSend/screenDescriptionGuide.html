<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>화면설계 Description</title>
  <link rel="stylesheet" href="../../../../assets/styles/style.css">
</head>
<body class="popup-document">
<!-- 자동 생성 파일: 직접 수정하지 말고 docs/DESCRIPTION_MAP.json 수정 후 python3 tools/build_description_guides.py 실행 -->
<div class="modal-backdrop description-guide-backdrop" id="screenDescriptionGuide" role="dialog" aria-modal="false" aria-labelledby="screenDescriptionGuideTitle" aria-hidden="true">
    <div class="modal-dialog modal-lg description-modal-dialog">
      <div class="modal-header">
        <h2 class="modal-title" id="screenDescriptionGuideTitle">화면설계 Description</h2>
        <button type="button" class="modal-close" aria-label="닫기">&times;</button>
      </div>
      <div class="modal-body description-modal-body">
        <section class="description-source-section" aria-labelledby="descriptionSection1">
          <h3 id="descriptionSection1">메일/메시지 발송</h3>
          <p class="description-source-meta">화면설계 10 · 슬라이드 14</p>
          <div class="description-mapping-list">
            <div class="description-mapping-item" data-description-ref="10-14:1">
              <span class="description-mapping-number" aria-hidden="true">1</span>
              <pre class="description-source-text">발송 대상을 유형(협력업체, 거래처, 직원)별로 선택해서 보낼 수 있음</pre>
            </div>
            <div class="description-mapping-item" data-description-ref="10-14:2">
              <span class="description-mapping-number" aria-hidden="true">2</span>
              <pre class="description-source-text">선택된 사람은 ‘대상 확정’ 영역에 추가됨</pre>
            </div>
          </div>
        </section>
        <section class="description-source-section" aria-labelledby="descriptionSection2">
          <h3 id="descriptionSection2">메일/메시지 발송(협력업체 선택)</h3>
          <p class="description-source-meta">화면설계 10 · 슬라이드 15</p>
          <div class="description-mapping-list">
            <div class="description-mapping-item" data-description-ref="10-15:1">
              <span class="description-mapping-number" aria-hidden="true">3</span>
              <pre class="description-source-text">사업자 번호, 업체명, 담당자, 휴대전화 번호, 이메일</pre>
            </div>
            <div class="description-mapping-item" data-description-ref="10-15:2">
              <span class="description-mapping-number" aria-hidden="true">4</span>
              <pre class="description-source-text">당연히 승인된 협력업체만 불러옴 </pre>
            </div>
          </div>
        </section>
        <section class="description-source-section" aria-labelledby="descriptionSection3">
          <h3 id="descriptionSection3">메일/메시지 발송(거래처 선택)</h3>
          <p class="description-source-meta">화면설계 10 · 슬라이드 16</p>
          <div class="description-mapping-list">
            <div class="description-mapping-item" data-description-ref="10-16:1">
              <span class="description-mapping-number" aria-hidden="true">5</span>
              <pre class="description-source-text">ERP와 연동된 거래처 목록 호출</pre>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>
  <script src="../../../../assets/scripts/dashboard.js"></script>
</body>
</html>
