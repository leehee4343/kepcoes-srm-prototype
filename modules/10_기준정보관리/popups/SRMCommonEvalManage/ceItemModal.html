<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>심사/평가 항목 관리</title>
  <link rel="stylesheet" href="../../../../assets/styles/style.css">
</head>
<body class="popup-document">
<div class="modal-backdrop" id="ceItemModal" role="dialog" aria-modal="true" aria-labelledby="ceItemTitle" aria-hidden="false">
    <div class="modal-dialog">
      <div class="modal-header"><h2 class="modal-title" id="ceItemTitle">심사/평가 항목 관리</h2><button type="button" class="modal-close" aria-label="닫기">&times;</button></div>
      <div class="modal-body">
        <div class="srm-kv-grid">
          <div class="srm-kv-row"><dt>심사/평가 구분 <span class="required" aria-hidden="true">*</span></dt><dd><div class="form-choice-group" role="radiogroup"><label class="form-choice"><input type="radio" name="ceItemGubun" checked>계량(정량)</label><label class="form-choice"><input type="radio" name="ceItemGubun">비계량(정성)</label></div></dd></div>
          <div class="srm-kv-row"><dt>심사/평가 항목 <span class="required" aria-hidden="true">*</span></dt><dd><input type="text" class="form-control fit-360"></dd></div>
          <div class="srm-kv-row"><dt>배점 <span class="required" aria-hidden="true">*</span></dt><dd><input type="text" class="form-control grow" placeholder="숫자로만 입력해 주세요.(소수점 가능)"></dd></div>
          <div class="srm-kv-row"><dt>자가심사 여부 <span class="required" aria-hidden="true">*</span></dt><dd><div class="form-choice-group" role="radiogroup"><label class="form-choice"><input type="radio" name="ceSelfEval" checked>불필요</label><label class="form-choice"><input type="radio" name="ceSelfEval">필요</label></div></dd></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-primary" data-close-modal>심사/평가 항목 추가</button>
        <button type="button" class="btn-primary" data-close-modal>수정</button>
        <button type="button" class="btn-secondary" data-close-modal>취소</button>
      </div>
    </div>
  </div>
  <script src="../../../../assets/scripts/dashboard.js"></script>
</body>
</html>
