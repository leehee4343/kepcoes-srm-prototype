<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>계약담당자 매핑</title>
  <link rel="stylesheet" href="../../../../assets/styles/style.css">
</head>
<body class="popup-document">
<div class="modal-backdrop" id="opContractMapModal2" role="dialog" aria-modal="true" aria-labelledby="opContractMapTitle2" aria-hidden="false" data-ui-defaults="{&quot;method&quot;:&quot;general&quot;,&quot;award&quot;:&quot;restricted&quot;,&quot;price&quot;:&quot;reserve&quot;,&quot;items&quot;:&quot;unit&quot;}" data-ui-scope="popup">
    <div class="modal-dialog modal-xl">
      <div class="modal-header"><h2 class="modal-title" id="opContractMapTitle2">계약담당자 매핑</h2><button type="button" class="modal-close" aria-label="닫기">&times;</button></div>
      <div class="modal-body">
        <section class="filter-card">
          <form data-ui-scope="filter">
          <div class="filter-row hstack gap-12">
            <span class="filter-label w-100">키워드 검색</span>
            <select class="filter-select w-130"><option>검색 구분</option></select>
            <input type="text" class="filter-text-input w-380" placeholder="검색어를 입력하세요." aria-label="검색어">
          </div>
            <div class="filter-action-row">
              <button type="button" class="btn-filter-search">검색</button>
              <button type="button" class="btn-filter-reset">초기화</button>
            </div>
          </form>
        </section>
        <div class="table-card">
          <div class="table-header-action-row">
            <div class="table-total-count grid-page-summary">1 / 6 (총 55개)</div>
            <div class="table-actions">
              <select class="select-per-page" title="페이지당 표시 건수">
                <option value="10" selected>10개씩</option>
                <option value="20">20개씩</option>
                <option value="50">50개씩</option>
              </select>
            </div>
          </div>
          <div class="table-scroll-wrapper data-grid" tabindex="0" aria-label="담당자 목록" data-total-items="55" data-total-pages="6">
            <table class="data-table data-grid-table" aria-label="담당자 목록">
            <thead><tr><th>사원번호</th><th>아이디</th><th>사원명</th><th>부서</th><th>직급</th><th>이메일</th><th class="w-70">선택</th></tr></thead>
            <tbody>
              <tr><td>2110004</td><td>simon</td><td class="text-left">홍길동</td><td class="text-left">기획지원팀</td><td>과장</td><td>simon@kepcoes.co.kr</td><td><button type="button" class="btn-task-register" data-close-modal>매핑</button></td></tr>
            </tbody>
          </table>
          </div>
        </div>
      </div>
      <div class="modal-footer"><button type="button" class="btn-secondary modal-close">닫기</button></div>
    </div>
  </div>
  <script src="../../../../assets/scripts/dashboard.js"></script>
</body>
</html>
