<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>품목 추가(공통 품목)</title>
  <link rel="stylesheet" href="../../../../assets/styles/style.css">
</head>
<body class="popup-document">
<div class="modal-backdrop" id="opCommonItemModal" role="dialog" aria-modal="true" aria-labelledby="opCommonItemTitle" aria-hidden="false">
    <div class="modal-dialog modal-xl">
      <div class="modal-header"><h2 class="modal-title" id="opCommonItemTitle">품목 추가(공통 품목)</h2><button type="button" class="modal-close" aria-label="닫기">&times;</button></div>
      <div class="modal-body">
        <section class="filter-card">
          <form>
  <div class="filter-row hstack gap-12">
            <span class="filter-label w-130">조회기간(등록일)</span>
            <div class="date-range-wrap hstack gap-6"><input type="date" class="filter-date-input"><span>~</span><input type="date" class="filter-date-input"></div>
              <div class="quick-date-btns hstack gap-6">
                <button type="button" class="btn-quick-date" data-range="1d">하루 전</button>
                <button type="button" class="btn-quick-date" data-range="1w">1주일</button>
                <button type="button" class="btn-quick-date active" data-range="1m">1개월</button>
                <button type="button" class="btn-quick-date" data-range="3m">3개월</button>
                <button type="button" class="btn-quick-date" data-range="6m">6개월</button>
                <button type="button" class="btn-quick-date" data-range="1y">1년</button>
              </div>
          </div>
  <div class="filter-row hstack gap-12">
            <span class="filter-label w-130">분류</span>
            <select class="filter-select w-140"><option>전체(대분류)</option></select>
            <select class="filter-select w-140"><option>전체(중분류)</option></select>
            <select class="filter-select w-140"><option>전체(소분류)</option></select>
          </div>
  <div class="filter-row hstack gap-12">
            <span class="filter-label w-130">발주단위</span>
            <select class="filter-select w-140"><option>전체(발주단위)</option></select>
          </div>
          <div class="filter-row hstack gap-12">
            <span class="filter-label w-130">키워드 검색</span>
            <select class="filter-select w-130"><option>검색 구분</option></select>
            <input type="text" class="filter-text-input w-380" placeholder="검색어를 입력하세요." aria-label="검색어">
          </div>
            <div class="filter-action-row">
              <button type="button" class="btn-filter-search">검색</button>
              <button type="button" class="btn-filter-reset">초기화</button>
            </div>
          </form>
        </section>
        <div class="table-card">
          <div class="table-header-action-row">
            <div class="table-total-count grid-page-summary">1 / 6 (총 55개)</div>
            <div class="table-actions">
              <select class="select-per-page" title="페이지당 표시 건수">
                <option value="10" selected>10개씩</option>
                <option value="20">20개씩</option>
                <option value="50">50개씩</option>
              </select>
            </div>
          </div>
          <div class="table-scroll-wrapper data-grid" tabindex="0" aria-label="공통 품목 목록" data-total-items="55" data-total-pages="6">
            <table class="data-table data-grid-table" aria-label="공통 품목 목록">
            <thead><tr><th class="w-40">선택</th><th>품목코드</th><th>품목명</th><th>대분류</th><th>중분류</th><th>소분류</th><th>발주단위</th></tr></thead>
            <tbody>
              <tr><td><input type="checkbox"></td><td>A0102-0001</td><td class="text-left">건축공사</td><td>제조사</td><td>고효율</td><td>ESSPCS</td><td>EA</td></tr>
              <tr><td><input type="checkbox"></td><td>A0103-001</td><td class="text-left">고효율 공기 압축기</td><td>-</td><td>-</td><td>-</td><td>EA</td></tr>
            </tbody>
          </table>
          </div>
        </div>
      </div>
      <div class="modal-footer"><button type="button" class="btn-primary" data-close-modal>선택 추가</button><button type="button" class="btn-secondary" data-close-modal>취소</button></div>
    </div>
  </div>
  <script src="../../../../assets/scripts/dashboard.js"></script>
</body>
</html>
